version: '3'

rpc:
  listen: tcp://127.0.0.1:6601

server:
  command: "php php_test_files/jobs/jobs_ok_pq.php"
  relay: "pipes"

nsq:
  addr: tcp://127.0.0.1:4150

logs:
  level: debug
  encoding: console
  mode: development

jobs:
  num_pollers: 2
  pipeline_size: 100000
  timeout: 100
  pool:
    num_workers: 2
    allocate_timeout: 60s
    # the workers outlive the destroy on purpose, so cap the wait
    destroy_timeout: 5s

  pipelines:
    test-1-pq:
      driver: nsq
      config:
        topic: rr-pq-1
        channel: default
        priority: 11
        prefetch: 5

    test-2-pq:
      driver: nsq
      config:
        topic: rr-pq-2
        channel: default
        priority: 11
        prefetch: 5

  # list of pipelines to be consumed by the server, keep empty if you want to start consuming manually
  consume: [ "test-1-pq", "test-2-pq" ]
